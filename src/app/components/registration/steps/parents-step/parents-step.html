<div [formGroup]="parentForm" class="flex flex-col w-full gap-6 lg:flex-row">
  
  <div formGroupName="ray" class="flex-1 p-6 border border-[#C5A29C] shadow-sm bg-pink-50/10 rounded-3xl">
    <div class="flex items-center gap-4 pb-4 mb-6 border-b">
      <div class="flex items-center justify-center w-16 h-16 bg-white border-2 border-gray-700 rounded-full shrink-0">
        <span class="text-3xl text-gray-600 material-icons">account_circle</span>
      </div>
      <div>
        <h3 class="text-lg font-bold text-gray-800">Raim-pianakaviana</h3>
        <span class="text-xs font-semibold tracking-wider text-gray-500 uppercase">Ray</span>
      </div>
    </div>
    
    <div class="grid grid-cols-12 gap-4">
      <div class="col-span-6">
        <label class="block mb-1 text-xs font-medium text-gray-600">Anarana</label>
        <input type="text" formControlName="anarana" class="w-full p-2 border border-gray-300 rounded outline-none focus:ring-1 focus:ring-blue-400">
      </div>
      
      <div class="col-span-6">
        <label class="block mb-1 text-xs font-medium text-gray-600">Fanampiny</label>
        <input type="text" formControlName="fanampiny" class="w-full p-2 border border-gray-300 rounded outline-none focus:ring-1 focus:ring-blue-400">
      </div>
      
      <div class="col-span-6">
        <label class="block mb-1 text-xs font-medium text-gray-600">Daty nahaterahany</label>
        <input type="date" formControlName="datyNahaterahany" class="w-full p-2 text-xs border border-gray-300 rounded outline-none focus:ring-1 focus:ring-blue-400">
      </div>
      
      <div class="col-span-6">
        <label class="block mb-1 text-xs font-medium text-gray-600">Asa atao</label>
        <input type="text" formControlName="asa" class="w-full p-2 border border-gray-300 rounded outline-none focus:ring-1 focus:ring-blue-400">
      </div>
      
      <div class="col-span-12">
        <label class="block mb-1 text-xs font-medium text-gray-600">Ray: Anarana feno</label>
        <input type="text" formControlName="rayAnaranaFeno" class="w-full p-2 border border-gray-300 rounded outline-none focus:ring-1 focus:ring-blue-400">
      </div>
      
      <div class="col-span-12">
        <label class="block mb-1 text-xs font-medium text-gray-600">Reny: Anarana feno</label>
        <input type="text" formControlName="renyAnaranaFeno" class="w-full p-2 border border-gray-300 rounded outline-none focus:ring-1 focus:ring-blue-400">
      </div>
      
      <div class="col-span-6">
        <label class="block mb-1 text-xs font-medium text-gray-600">Téléphone</label>
        <input type="text" formControlName="telephone" class="w-full p-2 border border-gray-300 rounded outline-none focus:ring-1 focus:ring-blue-400">
      </div>
      
      <div class="col-span-6">
        <label class="block mb-1 text-xs font-medium text-gray-600">Email</label>
        <input type="email" formControlName="email" class="w-full p-2 border border-gray-300 rounded outline-none focus:ring-1 focus:ring-blue-400">
      </div>
    </div>

    <div class="grid grid-cols-12 gap-4 pt-4 mt-6 border-t border-gray-100">
      <div class="col-span-4">
        <p class="mb-2 text-xs font-bold tracking-wide text-gray-700 uppercase">Sakrameta</p>
        <div class="flex flex-col gap-1 text-xs text-gray-600">
          <label class="flex items-center gap-1"><input type="checkbox" formControlName="batemy" class="rounded"> Batemy</label>
          <label class="flex items-center gap-1"><input type="checkbox" formControlName="konfesy" class="rounded"> Konfesy I</label>
          <label class="flex items-center gap-1"><input type="checkbox" formControlName="kominio" class="rounded"> Kominio I</label>
          <label class="flex items-center gap-1"><input type="checkbox" formControlName="fankaherezana" class="rounded"> Fankaherezana</label>
        </div>
      </div>

      <div class="self-start col-span-4">
        <p class="mb-2 text-xs font-bold tracking-wide text-gray-700 uppercase">Fikambanana</p>
        <select formControlName="fikambanana" class="w-full p-2 text-xs bg-white border border-gray-300 rounded outline-none focus:ring-1 focus:ring-blue-400">
          <option value=""></option>
          <option value="AFAFI">AFAFI</option>
        </select>
      </div>

      <div class="self-start col-span-4">
        <p class="mb-2 text-xs font-bold tracking-wide text-gray-700 uppercase">Vaomiera</p>
        <select formControlName="vaomiera" class="w-full p-2 text-xs bg-white border border-gray-300 rounded outline-none focus:ring-1 focus:ring-blue-400">
          <option value=""></option>
          <option value="SEFADA">SEFADA</option>
        </select>
      </div>
    </div>
  </div>

  <div formGroupName="reny" class="flex-1 p-6 border border-[#C5A29C] shadow-sm bg-blue-50/10 rounded-3xl">
    <div class="flex items-center gap-4 pb-4 mb-6 border-b">
      <div class="flex items-center justify-center w-16 h-16 bg-white border-2 border-gray-700 rounded-full shrink-0">
        <span class="text-3xl text-gray-600 material-icons">account_circle</span>
      </div>
      <div>
        <h3 class="text-lg font-bold text-gray-800">Renim-pianakaviana</h3>
        <span class="text-xs font-semibold tracking-wider text-gray-500 uppercase">Reny</span>
      </div>
    </div>
    
    <div class="grid grid-cols-12 gap-4">
      <div class="col-span-6">
        <label class="block mb-1 text-xs font-medium text-gray-600">Anarana</label>
        <input type="text" formControlName="anarana" class="w-full p-2 border border-gray-300 rounded outline-none focus:ring-1 focus:ring-blue-400">
      </div>
      <div class="col-span-6">
        <label class="block mb-1 text-xs font-medium text-gray-600">Fanampiny</label>
        <input type="text" formControlName="fanampiny" class="w-full p-2 border border-gray-300 rounded outline-none focus:ring-1 focus:ring-blue-400">
      </div>
      <div class="col-span-6">
        <label class="block mb-1 text-xs font-medium text-gray-600">Daty nahaterahany</label>
        <input type="date" formControlName="datyNahaterahany" class="w-full p-2 text-xs border border-gray-300 rounded outline-none focus:ring-1 focus:ring-blue-400">
      </div>
      <div class="col-span-6">
        <label class="block mb-1 text-xs font-medium text-gray-600">Asa atao</label>
        <input type="text" formControlName="asa" class="w-full p-2 border border-gray-300 rounded outline-none focus:ring-1 focus:ring-blue-400">
      </div>
      <div class="col-span-12">
        <label class="block mb-1 text-xs font-medium text-gray-600">Ray: Anarana feno</label>
        <input type="text" formControlName="rayAnaranaFeno" class="w-full p-2 border border-gray-300 rounded outline-none focus:ring-1 focus:ring-blue-400">
      </div>
      <div class="col-span-12">
        <label class="block mb-1 text-xs font-medium text-gray-600">Reny: Anarana feno</label>
        <input type="text" formControlName="renyAnaranaFeno" class="w-full p-2 border border-gray-300 rounded outline-none focus:ring-1 focus:ring-blue-400">
      </div>
      <div class="col-span-6">
        <label class="block mb-1 text-xs font-medium text-gray-600">Téléphone</label>
        <input type="text" formControlName="telephone" class="w-full p-2 border border-gray-300 rounded outline-none focus:ring-1 focus:ring-blue-400">
      </div>
      <div class="col-span-6">
        <label class="block mb-1 text-xs font-medium text-gray-600">Email</label>
        <input type="email" formControlName="email" class="w-full p-2 border border-gray-300 rounded outline-none focus:ring-1 focus:ring-blue-400">
      </div>
    </div>

    <div class="grid grid-cols-12 gap-4 pt-4 mt-6 border-t border-gray-100">
      <div class="col-span-4">
        <p class="mb-2 text-xs font-bold tracking-wide text-gray-700 uppercase">Sakrameta</p>
        <div class="flex flex-col gap-1 text-xs text-gray-600">
          <label class="flex items-center gap-1"><input type="checkbox" formControlName="batemy" class="rounded"> Batemy</label>
          <label class="flex items-center gap-1"><input type="checkbox" formControlName="konfesy" class="rounded"> Konfesy I</label>
          <label class="flex items-center gap-1"><input type="checkbox" formControlName="kominio" class="rounded"> Kominio I</label>
          <label class="flex items-center gap-1"><input type="checkbox" formControlName="fankaherezana" class="rounded"> Fankaherezana</label>
        </div>
      </div>
      <div class="self-start col-span-4">
        <p class="mb-2 text-xs font-bold tracking-wide text-gray-700 uppercase">Fikambanana</p>
        <select formControlName="fikambanana" class="w-full p-2 text-xs bg-white border border-gray-300 rounded outline-none focus:ring-1 focus:ring-blue-400">
          <option value=""></option>
          <option value="AFAFI">AFAFI</option>
        </select>
      </div>
      <div class="self-start col-span-4">
        <p class="mb-2 text-xs font-bold tracking-wide text-gray-700 uppercase">Vaomiera</p>
        <select formControlName="vaomiera" class="w-full p-2 text-xs bg-white border border-gray-300 rounded outline-none focus:ring-1 focus:ring-blue-400">
          <option value=""></option>
          <option value="SEFADA">SEFADA</option>
        </select>
      </div>
    </div>
  </div>

  <div class="self-start w-full p-6 border border-gray-200 lg:w-64 bg-gray-50 rounded-3xl shrink-0">
    <p class="pb-2 mb-4 text-sm font-bold tracking-wide text-gray-800 uppercase border-b">Fomba Fanambadiana</p>
    <div class="flex flex-col gap-3 text-sm text-gray-700">
      <label class="flex items-center gap-3 py-1 border-b border-gray-200 border-dashed cursor-pointer last:border-0">
        <input type="checkbox" formControlName="vitaSoratra" class="w-4 h-4 text-blue-600 rounded"> 
        <span>Vita soratra</span>
      </label>
      <label class="flex items-center gap-3 py-1 border-b border-gray-200 border-dashed cursor-pointer last:border-0">
        <input type="checkbox" formControlName="vitaMariazy" class="w-4 h-4 text-blue-600 rounded"> 
        <span>Vita mariazy</span>
      </label>
      <label class="flex items-center gap-3 py-1 border-b border-gray-200 border-dashed cursor-pointer last:border-0">
        <input type="checkbox" formControlName="divorce" class="w-4 h-4 text-blue-600 rounded"> 
        <span>Divorcé</span>
      </label>
      <label class="flex items-center gap-3 py-1 cursor-pointer last:border-0">
        <input type="checkbox" formControlName="mananonTena" class="w-4 h-4 text-blue-600 rounded"> 
        <span>Mananon-tena</span>
      </label>
    </div>
  </div>

</div>
